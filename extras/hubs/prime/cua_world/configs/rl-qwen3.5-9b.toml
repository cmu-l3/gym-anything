# Full cua-world RL run on Prime Hosted Training.
#
# 16 examples x 8 rollouts per step (batch 128). The 50-turn budget is the
# target; hosted models have a 64K context window and roughly 20-25 full-res
# screenshots fill it, so watch real sequence lengths on the dashboard and
# lower max_turns if rollouts hit the context ceiling.
#
# Launch:  prime train run extras/hubs/prime/cua_world/configs/rl-qwen3.5-9b.toml

model = "Qwen/Qwen3.5-9B"
max_steps = 100
batch_size = 128            # 16 examples x 8 rollouts (group size)
rollouts_per_example = 8

[sampling]
max_tokens = 1024

[[env]]
id = "pranjal2041/cua-world"
args = { agent = "Qwen3VLAgent", agent_args = { temperature = 1.0 }, env_names = ["gimp_env_all_fast"], split = "train", max_turns = 50, runner = "modal" }
