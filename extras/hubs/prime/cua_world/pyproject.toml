[project]
name = "cua-world"
version = "0.1.0"
description = "CUA-World computer-use benchmark as a verifiers environment: real desktop/mobile apps in cloud VMs (ModalRunner), scored by real per-task verifiers"
requires-python = ">=3.10"
dependencies = [
    "gym-anything[modal,prime-rl]",
]
tags = ["computer-use", "gui", "multi-turn", "vision", "tool-use", "multimodal", "real-world", "train", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["cua_world.py", "pyproject.toml", "README.md"]

[tool.hatch.metadata]
allow-direct-references = true

# Local development resolves gym-anything from this repo. Switch to a
# git-pinned source (rev = "<commit>") when publishing to the hub so the
# package installs standalone.
[tool.uv.sources]
gym-anything = { path = "../../../..", editable = true }

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
