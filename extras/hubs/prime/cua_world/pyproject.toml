[project]
name = "cua-world"
version = "0.1.0"
description = "CUA-World computer-use benchmark as a verifiers environment: real desktop/mobile apps in cloud VMs (ModalRunner), scored by real per-task verifiers"
requires-python = ">=3.10"
dependencies = [
    # Pinned so the published package installs standalone; bump the rev when
    # publishing a new version. The [tool.uv.sources] path below overrides
    # this for local development inside the repo.
    "gym-anything[modal,prime-rl] @ git+https://github.com/cmu-l3/gym-anything@4595ce1ff6f5c7b9c14340dcccbe6efe2b45dbf0",
]
tags = ["computer-use", "gui", "multi-turn", "vision", "tool-use", "multimodal", "real-world", "train", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["cua_world.py", "pyproject.toml", "README.md"]

[tool.hatch.metadata]
allow-direct-references = true

# Local development resolves gym-anything from this repo instead of the
# pinned git revision above.
[tool.uv.sources]
gym-anything = { path = "../../../..", editable = true }

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
