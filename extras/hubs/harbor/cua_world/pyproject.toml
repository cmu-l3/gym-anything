[project]
name = "harbor-cua-world-adapter"
version = "0.1.0"
description = "Harbor adapter for CUA-World-Long: 200 long-horizon computer-use tasks, one per software, in real desktop VMs"
readme = "README.md"
authors = [
    { name = "Pranjal Aggarwal", email = "pranjal2041@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Task enumeration and benchmark content (task.json metadata) come from
    # the gym-anything package; the generated task images pin the same ref.
    "gym-anything @ git+https://github.com/cmu-l3/gym-anything@main",
]

[project.scripts]
cua-world = "cua_world.main:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cua_world"
