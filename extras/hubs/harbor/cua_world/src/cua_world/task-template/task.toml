# Refer to https://harborframework.com/docs/task-format for more details.

schema_version = "1.0"

[task]
name = "__TASK_NAME__"
description = __TASK_DESCRIPTION__
authors = [{ name = "Pranjal Aggarwal", email = "pranjal2041@gmail.com" }]
keywords = ["computer-use", "gui", "long-horizon", "gym-anything"]

[metadata]
author_name = "Gym-Anything authors"
author_email = "pranjal2041@gmail.com"
benchmark = "cua-world-long"
difficulty = "hard"
category = "computer-use"
tags = [__TAGS__]
env_name = "__ENV_NAME__"
task_id = "__TASK_ID__"
max_steps = __MAX_STEPS__

[agent]
timeout_sec = __AGENT_TIMEOUT_SEC__

[verifier]
timeout_sec = __VERIFIER_TIMEOUT_SEC__

[environment]
build_timeout_sec = __BUILD_TIMEOUT_SEC__
cpus = 4
memory_mb = 8192
storage_mb = 40960
