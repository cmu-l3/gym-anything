[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-anything"
version = "0.1.0"
description = "A unified runtime and benchmark suite for computer-use agent research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20",
    "numpy>=1.26",
    "paramiko>=3.4",
    "Pillow>=10.0",
    "pycryptodome>=3.20",
    "PyYAML>=6.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
benchmark = [
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "statsmodels>=0.14",
]
services = [
    "Flask>=3.0",
    "flask-cors>=4.0",
    "httpx>=0.27",
    "hypercorn>=0.17",
    "psutil>=5.9",
    "quart>=0.19",
    "quart-cors>=0.7",
    "requests>=2.31",
]
vlm = [
    "anthropic>=0.30",
    "openai>=1.0",
]
baselines = [
    "anthropic>=0.30",
    "backoff>=2.2",
    "litellm>=1.52",
    "loguru>=0.7",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.scripts]
gym-anything = "gym_anything.cli:main"
gym-anything-dashboard = "services.dashboard.app:main"
gym-anything-master = "services.master.app:main"
gym-anything-worker = "services.worker.app:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = ".", "gym_anything" = "src/gym_anything"}
packages = [
    "gym_anything",
    "gym_anything.config",
    "gym_anything.presets",
    "gym_anything.recording",
    "gym_anything.remote",
    "gym_anything.runners",
    "gym_anything.runtime",
    "gym_anything.runtime.recording",
    "gym_anything.runtime.runners",
    "gym_anything.tui",
    "gym_anything.verification",
    "baselines",
    "baselines.agents",
    "baselines.common",
    "baselines.evaluation",
    "benchmarks",
    "benchmarks.registry",
    "services",
    "services.dashboard",
    "services.master",
    "services.worker",
]

[tool.setuptools.package-data]
gym_anything = [
    "presets/*.json",
    "presets/**/*.json",
    "presets/**/*.sh",
    "presets/**/Dockerfile",
    "runtime/runners/*.def",
    "runtime/runners/windows_setup/*.py",
]
benchmarks = [
    "splits/*.json",
]
