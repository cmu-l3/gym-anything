[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cua-world"
version = "0.1.0"
description = "CUA-World: the computer-use benchmark corpus for Gym-Anything (environments, tasks, splits, and the registry binding)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gym-anything",
]

# This distribution owns the shared `benchmarks` package namespace in
# installed environments; third-party benchmark corpora ship under their own
# top-level package names and resolve via the registry's bare-name fallback.
[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"../../benchmarks/__init__.py" = "benchmarks/__init__.py"
"../../benchmarks/cua_world" = "benchmarks/cua_world"

[tool.hatch.build.targets.sdist.force-include]
"../../benchmarks/__init__.py" = "benchmarks/__init__.py"
"../../benchmarks/cua_world" = "benchmarks/cua_world"
