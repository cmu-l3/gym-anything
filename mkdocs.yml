site_name: Gym-Anything
repo_name: gym-anything
repo_url: ""  # TODO: Set to the public repository URL before publishing docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - API: api.md
  - Specs: specs.md
  - Compatibility Checklist: compatibility.md
  - Presets: presets.md
  - Runners: runners.md
  - Caching: caching.md
  - Recording: recording.md
  - Tasks & Verifiers: tasks-verifiers.md
  - Environment Authoring: environment-authoring.md
  - Distributed Services: distributed-services.md
  - CLI: cli.md
  - Security: security.md
  - User Permissions: user-permissions.md
  - Examples: examples.md
  - Repository Structure: repository-structure.md
  - Contributing: contributing.md
  - Maintenance: maintenance.md
  - Current Limitations: current-limitations.md
  - Release Readiness: release-readiness.md
  - Release Audit Checklist: release-audit-checklist.md
  - Roadmap: roadmap.md
  - FAQ: faq.md
