name: Deploy website + docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build Fumadocs site
        working-directory: docs
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Assemble deploy directory
        run: |
          mkdir -p _site
          cp -r website/* _site/
          mkdir -p _site/docs
          cp -r docs/out/* _site/docs/
          touch _site/.nojekyll

      - name: Build CAPTCHA Bench dashboard
        env:
          PYTHONPATH: src
        run: >-
          python benchmarks/weird_captcha_gym/dashboard/export_static.py
          --output _site/captcha-bench

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
